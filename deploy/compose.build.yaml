# Build override for development and CI (ADR-0064 (i)). It adds build: and nothing else.
# Use: docker compose -f compose.yaml -f compose.build.yaml build
# Every service of an image of the project gets the same build section.
# Context paths are relative to the directory of compose.yaml. Each dockerfile path is relative to its context.
# The tag comes from image: in compose.yaml.
name: recipe-editor

# The context of recipe-server is the repository root (see the header of deploy/Dockerfile).
x-server-build: &server-build
  context: ..
  dockerfile: deploy/Dockerfile

# The context of recipe-pgtools is its own directory (bin/ and the crontab files).
# The named context db is deploy/db. The Dockerfile copies cluster-access.sh from it.
x-pgtools-build: &pgtools-build
  context: ./pgtools
  dockerfile: Dockerfile
  additional_contexts:
    db: ./db

services:
  app:
    build: *server-build
  migrate:
    build: *server-build
  backup:
    build: *pgtools-build
  backup-premigrate:
    build: *pgtools-build
  walarchive:
    build: *pgtools-build
  pitr-check:
    build: *pgtools-build
  restore-volume:
    build: *pgtools-build
