name: Audit

on:
  schedule:
    # Nightly run, reliability.md section 8.
    - cron: "17 2 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install cargo-audit
        uses: taiki-e/install-action@1168f6810a3cb30a3514bf5756a3b7f0422c6df8 # v2.87.28
        with:
          tool: cargo-audit@0.22
      # cargo audit reads the committed Cargo.lock.
      - name: Run cargo audit
        run: cargo audit

  npm-audit:
    name: Test tool audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: e2e/.nvmrc
      # ADR-0048 (b): npm audit reads the committed e2e/package-lock.json.
      - name: Run npm audit
        working-directory: e2e
        run: npm audit
