name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      upgrade_from:
        description: Previous release ref for the upgrade test
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  # A push to main always gets a complete CI result.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  compose:
    name: Compose stack
    # ADR-0094: Run the stack test on manual dispatch and pushes to main.
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
    env:
      RECIPE_VERSION: ci
      COMPOSE_PROJECT_NAME: recipe-ci-${{ github.run_id }}-${{ github.run_attempt }}
      COMPOSE_SUBNET: 172.28.0.0/16
      COMPOSE_IP_RANGE: 172.28.1.0/24
      PROXY_ADDRESS: 172.28.0.2
      SITE_ADDRESS: localhost
      DOCKER_BUILD_RECORD_UPLOAD: "false"
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check the CI scripts
        run: bash deploy/ci/check.sh
      - name: Prepare the disks and secrets (D11 steps 1 and 2)
        run: bash deploy/ci/prepare.sh
      - name: Set up Buildx (D11 step 3)
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build recipe-server
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: deploy/Dockerfile
          load: true
          push: false
          tags: recipe-server:ci
          cache-from: type=gha,scope=recipe-server
          cache-to: ${{ github.ref == 'refs/heads/main' && 'type=gha,mode=max,scope=recipe-server' || '' }}
      - name: Build recipe-pgtools
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: deploy/pgtools
          file: deploy/pgtools/Dockerfile
          build-contexts: db=deploy/db
          load: true
          push: false
          tags: recipe-pgtools:ci
          cache-from: type=gha,scope=recipe-pgtools
          cache-to: ${{ github.ref == 'refs/heads/main' && 'type=gha,mode=max,scope=recipe-pgtools' || '' }}
      # Allow 10 minutes per stack check and 20 minutes for recovery and memory checks.
      # Keep each step below the job limit so diagnostics can run after a step timeout.
      - name: Start from zero (D11 step 4)
        timeout-minutes: 10
        run: bash deploy/ci/start.sh
      - name: Check login and hidden health paths (D11 step 5)
        timeout-minutes: 10
        run: bash deploy/ci/login.sh
      - name: Check the redirect, uid, and database rejection (D11 step 6)
        timeout-minutes: 10
        run: bash deploy/ci/isolation.sh
      - name: Check backup and recovery (D11 step 7)
        timeout-minutes: 20
        run: bash deploy/ci/recovery.sh
      - name: Run the pgtools tests (D11 step 8)
        timeout-minutes: 10
        run: bash deploy/ci/pgtools.sh
      - name: Stop with a request in flight (D11 step 9)
        timeout-minutes: 10
        run: bash deploy/ci/stop.sh
      - name: Refuse one filesystem (D11 step 10)
        timeout-minutes: 10
        run: bash deploy/ci/same-filesystem.sh
      - name: Install the toolchain of rust-toolchain.toml
        run: rustup toolchain install
      - name: Cache the Rust build
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: compose-config
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Check the production refusal of insecure cookies
        run: bash deploy/ci/rust-tests.sh secure
      # Allow 3 minutes for diagnostics and 5 minutes for cleanup.
      - name: Show failure diagnostics (D11 step 11)
        if: failure()
        timeout-minutes: 3
        run: bash deploy/ci/diagnostics.sh
      - name: Release the runner resources
        if: always()
        timeout-minutes: 5
        run: bash deploy/ci/cleanup.sh

  upgrade:
    name: Upgrade an older volume
    # Match the Compose stack policy of ADR-0094. Dispatch this job on a branch.
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions:
      contents: read
    env:
      RECIPE_VERSION: ci-upgrade
      UPGRADE_FROM: ${{ inputs.upgrade_from }}
      UPGRADE_BEFORE: ${{ github.event.before }}
      COMPOSE_PROJECT_NAME: recipe-ci-${{ github.run_id }}-${{ github.run_attempt }}
      COMPOSE_SUBNET: 172.28.0.0/16
      COMPOSE_IP_RANGE: 172.28.1.0/24
      PROXY_ADDRESS: 172.28.0.2
      SITE_ADDRESS: localhost
      DOCKER_BUILD_RECORD_UPLOAD: "false"
    steps:
      - name: Check out the full history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Check the CI scripts
        run: bash deploy/ci/check.sh
      - name: Prepare the disks and secrets
        run: bash deploy/ci/prepare.sh
      - name: Set up Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      # Allow 35 minutes to build and start the previous release and write its backup.
      # Allow 30 minutes for the checks of steps 2 and 3, the upgrade, and three restore tests.
      # The step limits sum to 73 minutes with diagnostics and cleanup, below the job limit.
      - name: Build the previous images and write the old backup (before step 2)
        timeout-minutes: 35
        run: bash deploy/ci/upgrade.sh previous
      - name: Build and load the new server image (step 4)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: deploy/Dockerfile
          load: true
          push: false
          tags: recipe-server:ci-upgrade
          cache-from: type=gha,scope=recipe-server
      - name: Build and load the new pgtools image (step 4)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: deploy/pgtools
          file: deploy/pgtools/Dockerfile
          build-contexts: db=deploy/db
          load: true
          push: false
          tags: recipe-pgtools:ci-upgrade
          cache-from: type=gha,scope=recipe-pgtools
      - name: Check the volume and the old backup, upgrade, and check both restore paths (steps 2 to 23)
        timeout-minutes: 30
        run: bash deploy/ci/upgrade.sh upgrade
      # Allow 3 minutes for diagnostics and 5 minutes for cleanup.
      - name: Show upgrade failure diagnostics
        if: failure()
        timeout-minutes: 3
        run: bash deploy/ci/diagnostics.sh
      - name: Release the upgrade project and volumes
        if: always()
        timeout-minutes: 5
        run: bash deploy/ci/upgrade.sh cleanup

  restore-switch:
    name: Restore into a new volume
    # ADR-0094: Run the stack test on manual dispatch and pushes to main. Dispatch this job on a branch.
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    # The step limits sum to 111 minutes, with 3 for diagnostics and 5 for cleanup. This leaves 9 minutes below the job limit.
    timeout-minutes: 120
    permissions:
      contents: read
    env:
      RECIPE_VERSION: ci-restore-switch
      COMPOSE_PROJECT_NAME: recipe-ci-${{ github.run_id }}-${{ github.run_attempt }}
      COMPOSE_SUBNET: 172.28.0.0/16
      COMPOSE_IP_RANGE: 172.28.1.0/24
      PROXY_ADDRESS: 172.28.0.2
      SITE_ADDRESS: localhost
      DOCKER_BUILD_RECORD_UPLOAD: "false"
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check the CI scripts
        run: bash deploy/ci/check.sh
      - name: Prepare the disks and secrets
        run: bash deploy/ci/prepare.sh
      - name: Set up Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build recipe-server
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: deploy/Dockerfile
          load: true
          push: false
          tags: recipe-server:ci-restore-switch
          cache-from: type=gha,scope=recipe-server
      - name: Build recipe-pgtools
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: deploy/pgtools
          file: deploy/pgtools/Dockerfile
          build-contexts: db=deploy/db
          load: true
          push: false
          tags: recipe-pgtools:ci-restore-switch
          cache-from: type=gha,scope=recipe-pgtools
      # Allow 25 minutes to start the stack, write the data, and test the backup.
      # Keep the sum of the step limits below the job limit so diagnostics can run after a timeout.
      - name: Start the stack, write the data, and test the backup (D9 step 1)
        timeout-minutes: 25
        run: bash deploy/ci/restore-switch.sh prepare
      # Allow 6 minutes to fill the new volume with restore-volume.
      - name: Restore the backup set into a new volume (D9 step 2)
        timeout-minutes: 6
        run: bash deploy/ci/restore-switch.sh restore
      # Allow 8 minutes for the switch. It starts db twice and waits for the crash recovery.
      - name: Switch db to the new volume (D9 step 2)
        timeout-minutes: 8
        run: bash deploy/ci/restore-switch.sh switch
      # Allow 5 minutes for the client-rule checks, the passwords, and the logins. Each probe starts one container.
      - name: Check the client rules and set the passwords (D9 step 3)
        timeout-minutes: 5
        run: bash deploy/ci/restore-switch.sh access
      # Allow 8 minutes to move the old WAL files and to start the new WAL line. It takes a base backup.
      - name: Start the new WAL line (D9 step 3)
        timeout-minutes: 8
        run: bash deploy/ci/restore-switch.sh wal-line
      # Allow 20 minutes to start app, check the data, and run pitr-check and the backups.
      - name: Check the data and the new WAL line (D9 step 4)
        timeout-minutes: 20
        run: bash deploy/ci/restore-switch.sh check
      # Allow 6 minutes for the three negative cases. One of them runs initdb in a one-shot container.
      - name: Refuse the three wrong restores (D9 step 5)
        timeout-minutes: 6
        run: bash deploy/ci/restore-switch.sh refuse
      # Allow 20 minutes for the switch back. It runs two times, starts db once, and starts the new WAL line again.
      # The run ends with the login, the export, and the comparison of the files and the roles of both clusters.
      - name: Switch back to the old volume (D9 step 6)
        timeout-minutes: 20
        run: bash deploy/ci/restore-switch.sh switch-back
      # Allow 5 minutes to stop the project with the volume option and to check that both data volumes stay.
      - name: Keep the external data volumes (D9 step 7)
        timeout-minutes: 5
        run: bash deploy/ci/restore-switch.sh keep
      # Allow 3 minutes for diagnostics and 5 minutes for cleanup.
      - name: Show restore-switch failure diagnostics
        if: failure()
        timeout-minutes: 3
        run: bash deploy/ci/diagnostics.sh
      - name: Release the restore-switch project and volumes
        if: always()
        timeout-minutes: 5
        run: bash deploy/ci/restore-switch.sh cleanup

  musl-unwind:
    name: Panic unwind on musl
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      CC_x86_64_unknown_linux_musl: musl-gcc
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the musl toolchain
        run: bash deploy/ci/rust-tests.sh setup
      - name: Cache the Rust build
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: musl-unwind
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Run the panic tests
        run: bash deploy/ci/rust-tests.sh panic

  fmt:
    name: Format
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the toolchain of rust-toolchain.toml
        run: rustup toolchain install
      - name: Check formatting
        run: cargo fmt --all --check

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the toolchain of rust-toolchain.toml
        run: rustup toolchain install
      - name: Cache the Rust build
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Run clippy
        run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings

  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the toolchain of rust-toolchain.toml
        run: rustup toolchain install
      - name: Cache the Rust build
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Run tests
        run: cargo test --workspace --all-features --locked

  doc:
    name: Documentation
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      RUSTDOCFLAGS: -D warnings
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the toolchain of rust-toolchain.toml
        run: rustup toolchain install
      - name: Cache the Rust build
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Build the documentation
        run: cargo doc --workspace --no-deps --all-features --locked

  deny:
    name: Dependency policy
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the toolchain of rust-toolchain.toml
        run: rustup toolchain install
      - name: Install cargo-deny
        uses: taiki-e/install-action@1168f6810a3cb30a3514bf5756a3b7f0422c6df8 # v2.87.28
        with:
          tool: cargo-deny@0.19
      - name: Run cargo deny
        run: cargo deny --locked check

  coverage:
    name: Coverage
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the toolchain of rust-toolchain.toml
        run: rustup toolchain install
      - name: Add the LLVM tools
        run: rustup component add llvm-tools-preview
      - name: Cache the Rust build
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@1168f6810a3cb30a3514bf5756a3b7f0422c6df8 # v2.87.28
        with:
          tool: cargo-llvm-cov@0.6
      - name: Measure the line coverage
        run: cargo llvm-cov --workspace --all-features --locked --json --summary-only --output-path target/llvm-cov-summary.json
      # reliability.md section 6: 80 % line coverage per crate.
      # A crate with no executable line passes the gate.
      - name: Coverage gate (80 % lines per crate)
        run: python3 -I tools/coverage-gate.py target/llvm-cov-summary.json

  # Scope: ADR-0023. docs/plan/ is not normative and is out of scope.
  ste-lint:
    name: STE lint
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Run the STE lint
        shell: bash
        run: |
          shopt -s globstar nullglob
          files=(docs/architecture/**/*.md docs/adr/**/*.md docs/ops/**/*.md docs/user/**/*.md README.md CONTRIBUTING.md CHANGELOG.md)
          python3 -I tools/ste-lint/ste-lint.py "${files[@]}"

  migration-freeze:
    name: Migration freeze
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Check out the full history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Check the frozen migrations
        run: python3 -I -B deploy/ci/migration_freeze.py
