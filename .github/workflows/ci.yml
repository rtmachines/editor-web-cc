name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      upgrade_from:
        description: Previous release ref for the upgrade test
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  # A push to main always gets a complete CI result.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  ci-scripts:
    name: CI scripts
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check the CI scripts
        run: bash deploy/ci/check.sh

  compose:
    name: Compose stack
    # ADR-0094: Run the stack test on manual dispatch and pushes to main.
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
    env:
      RECIPE_VERSION: ci
      COMPOSE_PROJECT_NAME: recipe-ci-${{ github.run_id }}-${{ github.run_attempt }}
      COMPOSE_SUBNET: 172.28.0.0/16
      COMPOSE_IP_RANGE: 172.28.1.0/24
      PROXY_ADDRESS: 172.28.0.2
      SITE_ADDRESS: localhost
      DOCKER_BUILD_RECORD_UPLOAD: "false"
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check the CI scripts
        run: bash deploy/ci/check.sh
      - name: Prepare the disks and secrets (D11 steps 1 and 2)
        run: bash deploy/ci/prepare.sh
      - name: Set up Buildx (D11 step 3)
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build recipe-server
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: deploy/Dockerfile
          load: true
          push: false
          tags: recipe-server:ci
          cache-from: type=gha,scope=recipe-server
          cache-to: ${{ github.ref == 'refs/heads/main' && 'type=gha,mode=max,scope=recipe-server' || '' }}
      - name: Build recipe-pgtools
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: deploy/pgtools
          file: deploy/pgtools/Dockerfile
          build-contexts: db=deploy/db
          load: true
          push: false
          tags: recipe-pgtools:ci
          cache-from: type=gha,scope=recipe-pgtools
          cache-to: ${{ github.ref == 'refs/heads/main' && 'type=gha,mode=max,scope=recipe-pgtools' || '' }}
      # Allow 10 minutes per stack check and 20 minutes for recovery and memory checks.
      # Keep each step below the job limit so diagnostics can run after a step timeout.
      - name: Start from zero (D11 step 4)
        timeout-minutes: 10
        run: bash deploy/ci/start.sh
      - name: Check login and hidden health paths (D11 step 5)
        timeout-minutes: 10
        run: bash deploy/ci/login.sh
      - name: Check the redirect, uid, and database rejection (D11 step 6)
        timeout-minutes: 10
        run: bash deploy/ci/isolation.sh
      - name: Check backup and recovery (D11 step 7)
        timeout-minutes: 20
        run: bash deploy/ci/recovery.sh
      - name: Run the pgtools tests (D11 step 8)
        timeout-minutes: 10
        run: bash deploy/ci/pgtools.sh
      - name: Set up Node for the smoke suite
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: e2e/.nvmrc
          cache: npm
          cache-dependency-path: e2e/package-lock.json
      - name: Install the smoke npm packages
        working-directory: e2e
        run: npm ci
      - name: Cache Chromium for the smoke suite
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-smoke-chromium-${{ hashFiles('e2e/package-lock.json') }}
      - name: Install Chromium and its system dependencies
        working-directory: e2e
        run: npx playwright install --with-deps chromium
      - name: Run the end-to-end smoke suite
        id: smoke
        timeout-minutes: 10
        run: bash deploy/ci/smoke.sh
      - name: Upload the scanned smoke traces and report
        if: ${{ !cancelled() && (steps.smoke.outcome == 'success' || steps.smoke.outcome == 'failure') }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: compose-smoke
          path: ${{ runner.temp }}/${{ env.COMPOSE_PROJECT_NAME }}/state/smoke-upload
          if-no-files-found: ignore
          retention-days: 1
      - name: Stop with a request in flight (D11 step 9)
        timeout-minutes: 10
        run: bash deploy/ci/stop.sh
      - name: Refuse one filesystem (D11 step 10)
        timeout-minutes: 10
        run: bash deploy/ci/same-filesystem.sh
      - name: Install the toolchain of rust-toolchain.toml
        run: rustup toolchain install
      - name: Cache the Rust build
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: compose-config
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Check the production refusal of insecure cookies
        run: bash deploy/ci/rust-tests.sh secure
      # Allow 3 minutes for diagnostics and 5 minutes for cleanup.
      - name: Show failure diagnostics (D11 step 11)
        if: failure()
        timeout-minutes: 3
        run: bash deploy/ci/diagnostics.sh
      - name: Release the runner resources
        if: always()
        timeout-minutes: 5
        run: bash deploy/ci/cleanup.sh

  load:
    name: Load (${{ matrix.image }})
    # ADR-0128: A red load job on main blocks the next release.
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        image: [musl, cc-debian13]
    env:
      RECIPE_VERSION: ci-load-${{ matrix.image }}
      COMPOSE_PROJECT_NAME: recipe-ci-${{ github.run_id }}-${{ github.run_attempt }}
      COMPOSE_SUBNET: 172.28.0.0/16
      COMPOSE_IP_RANGE: 172.28.1.0/24
      PROXY_ADDRESS: 172.28.0.2
      SITE_ADDRESS: localhost
      DOCKER_BUILD_RECORD_UPLOAD: "false"
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check the runner before the stack
        id: runner
        run: python3 -I -B deploy/ci/load_flood.py runner
      - name: Check the CI scripts
        run: bash deploy/ci/check.sh
      - name: Prepare the disks and secrets
        id: prepare
        run: bash deploy/ci/prepare.sh
      - name: Set up Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build the shipped musl image
        id: build_musl
        if: matrix.image == 'musl'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: deploy/Dockerfile
          load: true
          push: false
          tags: recipe-server:ci-load-${{ matrix.image }}
          cache-from: type=gha,scope=recipe-server
      - name: Build the comparison cc-debian13 image
        id: build_cc_debian13
        if: matrix.image == 'cc-debian13'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: deploy/ci/Dockerfile.cc-debian13
          load: true
          push: false
          tags: recipe-server:ci-load-${{ matrix.image }}
          cache-from: type=gha,scope=recipe-server-cc-debian13
          cache-to: type=gha,mode=max,scope=recipe-server-cc-debian13
      - name: Build recipe-pgtools
        id: build_pgtools
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: deploy/pgtools
          file: deploy/pgtools/Dockerfile
          build-contexts: db=deploy/db
          load: true
          push: false
          tags: recipe-pgtools:ci-load-${{ matrix.image }}
          cache-from: type=gha,scope=recipe-pgtools
      - name: Start from zero
        id: start
        timeout-minutes: 10
        run: bash deploy/ci/start.sh
      - name: Create the first administrator and check login
        id: login
        timeout-minutes: 10
        run: bash deploy/ci/login.sh
      - name: Change the administrator password
        id: password
        timeout-minutes: 10
        shell: bash
        run: |
          set -euo pipefail
          source deploy/ci/common.sh
          http_probe password
      - name: Create the ProcessEngineer and replace its password
        id: approver
        timeout-minutes: 10
        shell: bash
        run: |
          set -euo pipefail
          source deploy/ci/common.sh
          openssl rand -hex 16 >"$CI_STATE/approver_password"
          python3 -I -B - <<'PY'
          import os
          import sys
          from pathlib import Path

          sys.path.insert(0, str(Path.cwd() / "deploy/ci"))
          from load_client import Client, HttpCheckError

          try:
              admin = Client(os.environ["CI_STATE"])
              admin.login("ci-admin", "new_password")
              admin.create_user("load-approver")
          except HttpCheckError as error:
              print(str(error), file=sys.stderr)
              sys.exit(1)
          except Exception:
              print("CI load could not create the approver.", file=sys.stderr)
              sys.exit(1)
          PY
      - name: Seed the draft and check its counts
        id: seed
        timeout-minutes: 30
        shell: bash
        run: |
          set -euo pipefail
          source deploy/ci/common.sh
          python3 -I -B deploy/ci/load_seed.py
      - name: Measure the three requests and check their bounds
        id: timings
        timeout-minutes: 10
        continue-on-error: ${{ matrix.image == 'cc-debian13' }}
        shell: bash
        run: |
          set -euo pipefail
          source deploy/ci/common.sh
          python3 -I -B - <<'PY'
          import json
          import os
          import subprocess
          import sys
          from pathlib import Path

          try:
              state = Path(os.environ["CI_STATE"])
              seed = json.loads((state / "load-seed.json").read_text(encoding="utf-8"))
              command = [sys.executable, "-I", "-B", "deploy/ci/load_timing.py",
                         "--reference", seed["reference"], "--version", "1",
                         "--approver", "load-approver", "--seed-seconds", str(seed["seed_seconds"]),
                         "--output", str(state / "load-timings.json")]
              status = subprocess.run(command, check=False).returncode
          except Exception:
              print("CI load could not start the timings.", file=sys.stderr)
              sys.exit(1)
          sys.exit(status)
          PY
      - name: Read memory after the timings
        id: memory_timings
        if: ${{ !cancelled() && steps.seed.outcome == 'success' }}
        timeout-minutes: 5
        run: bash deploy/ci/load.sh memory-timings
      - name: Recreate app and run the login flood
        id: flood
        if: ${{ !cancelled() && steps.seed.outcome == 'success' }}
        timeout-minutes: 10
        continue-on-error: ${{ matrix.image == 'cc-debian13' }}
        run: bash deploy/ci/load.sh flood
      - name: Check both memory readings and report the memory condition
        id: memory_check
        if: ${{ !cancelled() && steps.seed.outcome == 'success' }}
        timeout-minutes: 5
        continue-on-error: ${{ matrix.image == 'cc-debian13' }}
        run: bash deploy/ci/load.sh memory-check
      - name: Require the values from each leg
        id: values
        if: ${{ !cancelled() && steps.seed.outcome == 'success' }}
        shell: bash
        run: |
          set -euo pipefail
          source deploy/ci/common.sh
          python3 -I -B - <<'PY'
          import json
          import math
          import os
          import sys
          from pathlib import Path

          try:
              state = Path(os.environ["CI_STATE"])
              reports = {name: json.loads((state / f"load-{name}.json").read_text(encoding="utf-8"))
                         for name in ("seed", "timings", "flood", "memory")}
              timings = reports["timings"]["timings_seconds"]
              flood, memory = reports["flood"], reports["memory"]
              values = [reports["seed"]["seed_seconds"], reports["timings"]["seed_seconds"],
                        *(timings[name] for name in ("ApproveVersion", "CreateVersion", "GetVersion")),
                        flood["logins_per_second"], flood["p99_seconds"],
                        memory["timings"]["peak"], memory["flood"]["peak"], memory["peak"]]
              if any(type(value) not in (int, float) or not math.isfinite(value) or value < 0
                     for value in values):
                  raise ValueError("invalid measurement")
              if memory["adr_0064_o_memory_condition"] not in ("met", "not met"):
                  raise ValueError("missing memory condition")
          except Exception:
              print("CI load did not write all required JSON values.", file=sys.stderr)
              sys.exit(1)
          print("CI load wrote all required JSON values.")
          PY
      - name: Upload the JSON values of this leg
        id: upload
        if: ${{ !cancelled() && steps.values.outcome == 'success' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: load-${{ matrix.image }}
          if-no-files-found: error
          path: |
            ${{ runner.temp }}/${{ env.COMPOSE_PROJECT_NAME }}/state/load-seed.json
            ${{ runner.temp }}/${{ env.COMPOSE_PROJECT_NAME }}/state/load-timings.json
            ${{ runner.temp }}/${{ env.COMPOSE_PROJECT_NAME }}/state/load-flood.json
            ${{ runner.temp }}/${{ env.COMPOSE_PROJECT_NAME }}/state/load-memory.json
      - name: Show load failure diagnostics
        id: diagnostics
        if: failure()
        timeout-minutes: 3
        run: bash deploy/ci/diagnostics.sh
      - name: Release the load project and volumes
        id: cleanup
        if: always()
        timeout-minutes: 5
        run: bash deploy/ci/cleanup.sh

  upgrade:
    name: Upgrade an older volume
    # Match the Compose stack policy of ADR-0094. Dispatch this job on a branch.
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions:
      contents: read
    env:
      RECIPE_VERSION: ci-upgrade
      UPGRADE_FROM: ${{ inputs.upgrade_from }}
      UPGRADE_BEFORE: ${{ github.event.before }}
      COMPOSE_PROJECT_NAME: recipe-ci-${{ github.run_id }}-${{ github.run_attempt }}
      COMPOSE_SUBNET: 172.28.0.0/16
      COMPOSE_IP_RANGE: 172.28.1.0/24
      PROXY_ADDRESS: 172.28.0.2
      SITE_ADDRESS: localhost
      DOCKER_BUILD_RECORD_UPLOAD: "false"
    steps:
      - name: Check out the full history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Check the CI scripts
        run: bash deploy/ci/check.sh
      - name: Prepare the disks and secrets
        run: bash deploy/ci/prepare.sh
      - name: Set up Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      # Allow 35 minutes to build and start the previous release and write its backup.
      # Allow 30 minutes for the checks of steps 2 and 3, the upgrade, and three restore tests.
      # The step limits sum to 73 minutes with diagnostics and cleanup, below the job limit.
      - name: Build the previous images and write the old backup (before step 2)
        timeout-minutes: 35
        run: bash deploy/ci/upgrade.sh previous
      - name: Build and load the new server image (step 4)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: deploy/Dockerfile
          load: true
          push: false
          tags: recipe-server:ci-upgrade
          cache-from: type=gha,scope=recipe-server
      - name: Build and load the new pgtools image (step 4)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: deploy/pgtools
          file: deploy/pgtools/Dockerfile
          build-contexts: db=deploy/db
          load: true
          push: false
          tags: recipe-pgtools:ci-upgrade
          cache-from: type=gha,scope=recipe-pgtools
      - name: Check the volume and the old backup, upgrade, and check both restore paths (steps 2 to 23)
        timeout-minutes: 30
        run: bash deploy/ci/upgrade.sh upgrade
      # Allow 3 minutes for diagnostics and 5 minutes for cleanup.
      - name: Show upgrade failure diagnostics
        if: failure()
        timeout-minutes: 3
        run: bash deploy/ci/diagnostics.sh
      - name: Release the upgrade project and volumes
        if: always()
        timeout-minutes: 5
        run: bash deploy/ci/upgrade.sh cleanup

  restore-switch:
    name: Restore into a new volume
    # ADR-0094: Run the stack test on manual dispatch and pushes to main. Dispatch this job on a branch.
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    # The step limits sum to 111 minutes, with 3 for diagnostics and 5 for cleanup. This leaves 9 minutes below the job limit.
    timeout-minutes: 120
    permissions:
      contents: read
    env:
      RECIPE_VERSION: ci-restore-switch
      COMPOSE_PROJECT_NAME: recipe-ci-${{ github.run_id }}-${{ github.run_attempt }}
      COMPOSE_SUBNET: 172.28.0.0/16
      COMPOSE_IP_RANGE: 172.28.1.0/24
      PROXY_ADDRESS: 172.28.0.2
      SITE_ADDRESS: localhost
      DOCKER_BUILD_RECORD_UPLOAD: "false"
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check the CI scripts
        run: bash deploy/ci/check.sh
      - name: Prepare the disks and secrets
        run: bash deploy/ci/prepare.sh
      - name: Set up Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build recipe-server
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: deploy/Dockerfile
          load: true
          push: false
          tags: recipe-server:ci-restore-switch
          cache-from: type=gha,scope=recipe-server
      - name: Build recipe-pgtools
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: deploy/pgtools
          file: deploy/pgtools/Dockerfile
          build-contexts: db=deploy/db
          load: true
          push: false
          tags: recipe-pgtools:ci-restore-switch
          cache-from: type=gha,scope=recipe-pgtools
      # Allow 25 minutes to start the stack, write the data, and test the backup.
      # Keep the sum of the step limits below the job limit so diagnostics can run after a timeout.
      - name: Start the stack, write the data, and test the backup (D9 step 1)
        timeout-minutes: 25
        run: bash deploy/ci/restore-switch.sh prepare
      # Allow 6 minutes to fill the new volume with restore-volume.
      - name: Restore the backup set into a new volume (D9 step 2)
        timeout-minutes: 6
        run: bash deploy/ci/restore-switch.sh restore
      # Allow 8 minutes for the switch. It starts db twice and waits for the crash recovery.
      - name: Switch db to the new volume (D9 step 2)
        timeout-minutes: 8
        run: bash deploy/ci/restore-switch.sh switch
      # Allow 5 minutes for the client-rule checks, the passwords, and the logins. Each probe starts one container.
      - name: Check the client rules and set the passwords (D9 step 3)
        timeout-minutes: 5
        run: bash deploy/ci/restore-switch.sh access
      # Allow 8 minutes to move the old WAL files and to start the new WAL line. It takes a base backup.
      - name: Start the new WAL line (D9 step 3)
        timeout-minutes: 8
        run: bash deploy/ci/restore-switch.sh wal-line
      # Allow 20 minutes to start app, check the data, and run pitr-check and the backups.
      - name: Check the data and the new WAL line (D9 step 4)
        timeout-minutes: 20
        run: bash deploy/ci/restore-switch.sh check
      # Allow 6 minutes for the three negative cases. One of them runs initdb in a one-shot container.
      - name: Refuse the three wrong restores (D9 step 5)
        timeout-minutes: 6
        run: bash deploy/ci/restore-switch.sh refuse
      # Allow 20 minutes for the switch back. It runs two times, starts db once, and starts the new WAL line again.
      # The run ends with the login, the export, and the comparison of the files and the roles of both clusters.
      - name: Switch back to the old volume (D9 step 6)
        timeout-minutes: 20
        run: bash deploy/ci/restore-switch.sh switch-back
      # Allow 5 minutes to stop the project with the volume option and to check that both data volumes stay.
      - name: Keep the external data volumes (D9 step 7)
        timeout-minutes: 5
        run: bash deploy/ci/restore-switch.sh keep
      # Allow 3 minutes for diagnostics and 5 minutes for cleanup.
      - name: Show restore-switch failure diagnostics
        if: failure()
        timeout-minutes: 3
        run: bash deploy/ci/diagnostics.sh
      - name: Release the restore-switch project and volumes
        if: always()
        timeout-minutes: 5
        run: bash deploy/ci/restore-switch.sh cleanup

  pitr-recovery:
    name: Recover from the WAL archive
    # ADR-0094: Run the stack test on manual dispatch and pushes to main. Dispatch this job on a branch.
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    # The step limits sum to 140 minutes, with 3 for diagnostics and 5 for cleanup. This leaves 10 minutes below the job limit.
    timeout-minutes: 150
    permissions:
      contents: read
    env:
      RECIPE_VERSION: ci-pitr-recovery
      COMPOSE_PROJECT_NAME: recipe-ci-${{ github.run_id }}-${{ github.run_attempt }}
      COMPOSE_SUBNET: 172.28.0.0/16
      COMPOSE_IP_RANGE: 172.28.1.0/24
      PROXY_ADDRESS: 172.28.0.2
      SITE_ADDRESS: localhost
      DOCKER_BUILD_RECORD_UPLOAD: "false"
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check the CI scripts
        run: bash deploy/ci/check.sh
      - name: Prepare the disks and secrets
        run: bash deploy/ci/prepare.sh
      - name: Set up Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build recipe-server
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: deploy/Dockerfile
          load: true
          push: false
          tags: recipe-server:ci-pitr-recovery
          cache-from: type=gha,scope=recipe-server
      - name: Build recipe-pgtools
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: deploy/pgtools
          file: deploy/pgtools/Dockerfile
          build-contexts: db=deploy/db
          load: true
          push: false
          tags: recipe-pgtools:ci-pitr-recovery
          cache-from: type=gha,scope=recipe-pgtools
      # Keep the sum of the step limits below the job limit so diagnostics can run after a timeout.
      # Allow 25 minutes to start the stack, change the password, and take the first base backup.
      - name: Start the stack and take the first base backup (D8 prepare)
        timeout-minutes: 25
        run: bash deploy/ci/pitr-recovery.sh prepare
      # Allow 5 minutes for the two marker commits and the flush wait. The wait ends at a full second.
      - name: Commit the two markers and record the target time (D8 markers)
        timeout-minutes: 12
        run: bash deploy/ci/pitr-recovery.sh markers
      # Allow 15 minutes for the drill into a drill volume and the refused switch.
      - name: Run the drill and refuse its volume (D8 drill)
        timeout-minutes: 15
        run: bash deploy/ci/pitr-recovery.sh drill
      # Allow 10 minutes for the target after the newest commit and for the gap in the WAL.
      - name: Refuse a late target and a gap in the WAL (D8 refusals)
        timeout-minutes: 10
        run: bash deploy/ci/pitr-recovery.sh refusals
      # Allow 8 minutes to stop app and backup, kill db, stop walarchive, and delete pg_control.
      - name: Crash the database and lose pg_control (D8 crash)
        timeout-minutes: 8
        run: bash deploy/ci/pitr-recovery.sh crash
      # Allow 20 minutes to run pitr-volume to the end of the archive.
      - name: Recover into a new volume (D8 recover)
        timeout-minutes: 20
        run: bash deploy/ci/pitr-recovery.sh recover
      # Allow 8 minutes for the switch. It starts db and waits for the crash recovery.
      - name: Switch db to the recovered volume (D8 switch)
        timeout-minutes: 8
        run: bash deploy/ci/pitr-recovery.sh switch
      # Allow 8 minutes to set the passwords, move the old WAL files, and start the new WAL line.
      - name: Start the new WAL line (D8 wal-line)
        timeout-minutes: 8
        run: bash deploy/ci/pitr-recovery.sh wal-line
      # Allow 20 minutes to start app, prove the recovery point, run the backups, and check the recovery time.
      - name: Check the recovery point and the new WAL line (D8 check)
        timeout-minutes: 20
        run: bash deploy/ci/pitr-recovery.sh check
      # Allow 6 minutes for the refusal of a segment of the old timeline.
      - name: Refuse a segment of the old timeline (D8 refuse)
        timeout-minutes: 6
        run: bash deploy/ci/pitr-recovery.sh refuse
      # Allow 3 minutes for diagnostics and 5 minutes for cleanup.
      - name: Show pitr-recovery failure diagnostics
        if: failure()
        timeout-minutes: 3
        run: bash deploy/ci/diagnostics.sh
      - name: Release the pitr-recovery project and volumes
        if: always()
        timeout-minutes: 5
        run: bash deploy/ci/pitr-recovery.sh cleanup

  musl-unwind:
    name: Panic unwind on musl
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      CC_x86_64_unknown_linux_musl: musl-gcc
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the musl toolchain
        run: bash deploy/ci/rust-tests.sh setup
      - name: Cache the Rust build
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: musl-unwind
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Run the panic tests
        run: bash deploy/ci/rust-tests.sh panic

  fmt:
    name: Format
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the toolchain of rust-toolchain.toml
        run: rustup toolchain install
      - name: Check formatting
        run: cargo fmt --all --check

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the toolchain of rust-toolchain.toml
        run: rustup toolchain install
      - name: Cache the Rust build
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Run clippy
        run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings

  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the toolchain of rust-toolchain.toml
        run: rustup toolchain install
      - name: Cache the Rust build
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Run tests
        run: cargo test --workspace --all-features --locked

  doc:
    name: Documentation
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      RUSTDOCFLAGS: -D warnings
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the toolchain of rust-toolchain.toml
        run: rustup toolchain install
      - name: Cache the Rust build
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Build the documentation
        run: cargo doc --workspace --no-deps --all-features --locked

  deny:
    name: Dependency policy
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the toolchain of rust-toolchain.toml
        run: rustup toolchain install
      - name: Install cargo-deny
        uses: taiki-e/install-action@1168f6810a3cb30a3514bf5756a3b7f0422c6df8 # v2.87.28
        with:
          tool: cargo-deny@0.19
      - name: Run cargo deny
        run: cargo deny --locked check

  coverage:
    name: Coverage
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      # The instrumented build fills the disk of the hosted runner.
      # The prune removes the preinstalled images. The recipe-db tests pull their PostgreSQL image later.
      - name: Free the runner disk
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL
          docker image prune --all --force
          df -h /
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the toolchain of rust-toolchain.toml
        run: rustup toolchain install
      - name: Add the LLVM tools
        run: rustup component add llvm-tools-preview
      - name: Cache the Rust build
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@1168f6810a3cb30a3514bf5756a3b7f0422c6df8 # v2.87.28
        with:
          tool: cargo-llvm-cov@0.6.24
      - name: Test the coverage gate
        run: python3 -I -B tools/test_coverage_gate.py
      - name: Measure the line coverage
        run: cargo llvm-cov --workspace --all-features --locked --json --summary-only --output-path target/llvm-cov-summary.json
      # reliability.md section 6: 80 % line coverage per crate.
      # A crate with production files and no reported lines fails the gate.
      - name: Coverage gate (80 % lines per crate)
        run: python3 -I -B tools/coverage-gate.py target/llvm-cov-summary.json

  # Scope: ADR-0023. docs/plan/ is not normative and is out of scope.
  ste-lint:
    name: STE lint
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Run the STE lint
        shell: bash
        run: |
          shopt -s globstar nullglob
          files=(docs/architecture/**/*.md docs/adr/**/*.md docs/ops/**/*.md docs/user/**/*.md README.md CONTRIBUTING.md CHANGELOG.md)
          python3 -I tools/ste-lint/ste-lint.py "${files[@]}"

  migration-freeze:
    name: Migration freeze
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Check out the full history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Check the frozen migrations
        run: python3 -I -B deploy/ci/migration_freeze.py

  migration-rewrite:
    name: Migration rewrite
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Test the migration rewrite check
        run: python3 -I -B deploy/ci/test_migration_rewrite.py
      - name: Check the migrations for rewrites
        run: python3 -I -B deploy/ci/migration_rewrite.py migrations
