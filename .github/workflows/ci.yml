name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  # A push to main always gets a complete CI result.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  fmt:
    name: Format
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the toolchain of rust-toolchain.toml
        run: rustup toolchain install
      - name: Check formatting
        run: cargo fmt --all --check

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the toolchain of rust-toolchain.toml
        run: rustup toolchain install
      - name: Cache the Rust build
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Run clippy
        run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings

  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the toolchain of rust-toolchain.toml
        run: rustup toolchain install
      - name: Cache the Rust build
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Run tests
        run: cargo test --workspace --all-features --locked

  doc:
    name: Documentation
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      RUSTDOCFLAGS: -D warnings
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the toolchain of rust-toolchain.toml
        run: rustup toolchain install
      - name: Cache the Rust build
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Build the documentation
        run: cargo doc --workspace --no-deps --all-features --locked

  deny:
    name: Dependency policy
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the toolchain of rust-toolchain.toml
        run: rustup toolchain install
      - name: Install cargo-deny
        uses: taiki-e/install-action@1168f6810a3cb30a3514bf5756a3b7f0422c6df8 # v2.87.28
        with:
          tool: cargo-deny@0.19
      - name: Run cargo deny
        run: cargo deny --locked check

  coverage:
    name: Coverage
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the toolchain of rust-toolchain.toml
        run: rustup toolchain install
      - name: Add the LLVM tools
        run: rustup component add llvm-tools-preview
      - name: Cache the Rust build
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@1168f6810a3cb30a3514bf5756a3b7f0422c6df8 # v2.87.28
        with:
          tool: cargo-llvm-cov@0.6
      - name: Measure the line coverage
        run: cargo llvm-cov --workspace --all-features --locked --json --summary-only --output-path target/llvm-cov-summary.json
      # reliability.md section 6: 80 % line coverage per crate.
      # A crate with no executable line passes the gate.
      - name: Coverage gate (80 % lines per crate)
        run: python3 -I tools/coverage-gate.py target/llvm-cov-summary.json

  # Scope: ADR-0023. docs/plan/ is not normative and is out of scope.
  ste-lint:
    name: STE lint
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Run the STE lint
        shell: bash
        run: |
          shopt -s globstar nullglob
          files=(docs/architecture/**/*.md docs/adr/**/*.md docs/ops/**/*.md docs/user/**/*.md README.md CONTRIBUTING.md CHANGELOG.md)
          python3 -I tools/ste-lint/ste-lint.py "${files[@]}"
