{% extends "base.html" %}
{% block content %}
<h1>{{ t.get("password-title") }}</h1>
{% if must_change %}<p class="notice" role="note">{{ t.get("password-must-change") }}</p>
{% endif %}
<form method="post" action="/me/password" hx-post="/me/password" hx-target="#password-result" hx-sync="closest form:drop">
<input type="hidden" name="csrf_token" value="{{ csrf_token }}">
<p><label for="current_password">{{ t.get("password-label-current") }}</label>
<input id="current_password" type="password" name="current_password" maxlength="128" required autocomplete="current-password"></p>
<p><label for="password">{{ t.get("password-label-new") }}</label>
<input id="password" type="password" name="password" maxlength="128" required autocomplete="new-password"></p>
<p>{{ t.get("password-hint") }}</p>
<p><button type="submit">{{ t.get("password-submit") }}</button></p>
</form>
<div id="password-result"></div>
{% include "logout-form.html" %}
{% endblock %}
