{% import "components/field.html" as fields -%}
<form id="user-role-form" method="post" action="/users/{{ v.login }}/role" hx-boost="true" hx-target="#user-result" hx-swap="innerHTML" hx-push-url="false" hx-sync="closest form:drop"{% if v.role_oob %} hx-swap-oob="true"{% endif %}>
<input type="hidden" name="csrf_token" value="{{ v.csrf_token }}">
{{ fields::select(t, "role", t.get("user-role-label"), String::new(), v.roles.as_slice(), v.selected_role, true, v.role_errors.lines("role")) }}
<p class="actions"><button type="submit" id="user-role-submit">{{ t.get("user-role-submit") }}</button></p>
</form>
