[package]
name = "recipe-web"
description = "Routers, templates, HTMX fragments, and i18n of the recipe editor"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

# overview.md section 5: recipe-web depends on recipe-app, recipe-domain, and recipe-export.
# design.md D3 lists the other crates. recipe-web uses no sqlx and no session library.
[dependencies]
recipe-app = { workspace = true }
recipe-domain = { workspace = true }
recipe-export = { workspace = true }
axum = { workspace = true }
askama = { workspace = true }
tower-http = { workspace = true, features = ["catch-panic", "set-header", "timeout", "trace"] }
tokio = { workspace = true, features = ["sync", "time"] }
fluent = { workspace = true }
serde = { workspace = true, features = ["derive"] }
tracing = { workspace = true }
uuid = { workspace = true, features = ["v7"] }
subtle = { workspace = true }
cookie = { workspace = true }
thiserror = { workspace = true }

[dev-dependencies]
recipe-app = { workspace = true, features = ["memory"] }
tower = { workspace = true, features = ["util"] }
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "test-util"] }
# The channel body of the test of the body deadline (design D14 row T10).
http-body-util = { workspace = true, features = ["channel"] }
parking_lot = { workspace = true }
sha2 = { workspace = true }
time = { workspace = true }
tracing-subscriber = { workspace = true, features = ["fmt"] }

[lints]
workspace = true

# Design D15 of the change web-plant-model: the dev server for the test in a browser.
# `test = true` makes `cargo test` run the unit tests of the example.
[[example]]
name = "dev_server"
test = true
